name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Run every JavaScript action (checkout, setup-node, upload-pages-artifact,
# deploy-pages) on Node 24. GitHub is retiring the Node 20 runtime that some of
# these actions still declare; opting in early silences the deprecation warning
# and locks the runtime in ahead of the June 16 2026 forced cutover. Set at
# workflow level so it applies to every step in every job (a step-level env only
# covers that one action).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        # User-page repo deploys at https://lutzfinger.github.io/ (root).
        # When DNS cuts over to www.lutzfinger.com, set a CNAME file and the
        # site URL in astro.config.mjs already targets the production domain.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
