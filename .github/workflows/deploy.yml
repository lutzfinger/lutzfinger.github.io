name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# All actions below are pinned to their latest Node 24-native majors, so the
# workflow no longer needs the FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 override that
# worked around GitHub retiring the Node 20 runtime (forced June 16 2026,
# removed Sept 16 2026). Keep these majors current to stay off Node 20.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        # User-page repo deploys at https://lutzfinger.github.io/ (root).
        # When DNS cuts over to www.lutzfinger.com, set a CNAME file and the
        # site URL in astro.config.mjs already targets the production domain.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
